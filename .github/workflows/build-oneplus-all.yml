name: OnePlus Multi-Device Kernel Builder (Android 16)

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '选择目标手机型号 (全部针对 Android 16)'
        required: true
        default: 'op8t_evox'
        type: choice
        options:
          - 'op8t_evox (一加8T - EvolutionX A16)'
          - 'op9r_evox (一加9R - EvolutionX A16)'
          - 'op9_evox (一加9 - EvolutionX A16)'
          - 'op9pro_evox (一加9Pro - EvolutionX A16)'
          - 'op9rt_lineage (一加9RT - LineageOS A16)'
      ksu_type:
        description: '集成的 Root 隐藏方案'
        required: true
        default: 'ksu_next'
        type: choice
        options:
          - 'ksu (标准 KernelSU)'
          - 'ksu_next (KernelSU-Next 强力推荐)'

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出编译仓库源码
        uses: actions/checkout@v4

      - name: 2. 动态匹配并注入 Android 16 机型参数
        id: setup_env
        run: |
          DEVICE="${{ github.event.inputs.device_model }}"
          KSU_CHOOSE="${{ github.event.inputs.ksu_type }}"
          
          echo "=== 正在为您初始化 Android 16 环境参数 ==="
          
          # 一加 8T (EvolutionX A16 系统采用 LineageOS 23 源码树)
          if [[ "$DEVICE" == *"op8t_evox"* ]]; then
            echo "KERNEL_SOURCE=https://github.com/LineageOS/android_kernel_oneplus_sm8250" >> $GITHUB_ENV
            echo "KERNEL_SOURCE_BRANCH=lineage-23" >> $GITHUB_ENV
            echo "KERNEL_DEFCONFIG=vendor/kebab_defconfig" >> $GITHUB_ENV
            echo "CLANG_VERSION=r510822" >> $GITHUB_ENV
          
          # 一加 9R (EvolutionX A16 系统同上)
          elif [[ "$DEVICE" == *"op9r_evox"* ]]; then
            echo "KERNEL_SOURCE=https://github.com/LineageOS/android_kernel_oneplus_sm8250" >> $GITHUB_ENV
            echo "KERNEL_SOURCE_BRANCH=lineage-23" >> $GITHUB_ENV
            echo "KERNEL_DEFCONFIG=vendor/lemonadav_defconfig" >> $GITHUB_ENV
            echo "CLANG_VERSION=r510822" >> $GITHUB_ENV
          
          # 一加 9 (EvolutionX A16 系统采用其官方维护的 baklava 分支)
          elif [[ "$DEVICE" == *"op9_evox"* ]]; then
            echo "KERNEL_SOURCE=https://github.com/Evolution-X-Devices/kernel_oneplus_sm8350" >> $GITHUB_ENV
            echo "KERNEL_SOURCE_BRANCH=baklava" >> $GITHUB_ENV
            echo "KERNEL_DEFCONFIG=vendor/lahaina_defconfig" >> $GITHUB_ENV
            echo "CLANG_VERSION=r522817" >> $GITHUB_ENV
          
          # 一加 9 Pro (EvolutionX A16 系统同上)
          elif [[ "$DEVICE" == *"op9pro_evox"* ]]; then
            echo "KERNEL_SOURCE=https://github.com/Evolution-X-Devices/kernel_oneplus_sm8350" >> $GITHUB_ENV
            echo "KERNEL_SOURCE_BRANCH=baklava" >> $GITHUB_ENV
            echo "KERNEL_DEFCONFIG=vendor/lahaina_defconfig" >> $GITHUB_ENV
            echo "CLANG_VERSION=r522817" >> $GITHUB_ENV
          
          # 一加 9RT (LineageOS A16 系统独立源码树)
          elif [[ "$DEVICE" == *"op9rt_lineage"* ]]; then
            echo "KERNEL_SOURCE=https://github.com/LineageOS/android_kernel_oneplus_sm8350" >> $GITHUB_ENV
            echo "KERNEL_SOURCE_BRANCH=lineage-23" >> $GITHUB_ENV
            echo "KERNEL_DEFCONFIG=vendor/martini_defconfig" >> $GITHUB_ENV
            echo "CLANG_VERSION=r522817" >> $GITHUB_ENV
          fi

          # 统一配置隐藏方案变量
          if [ "$KSU_CHOOSE" = "ksu" ]; then
            echo "ENABLE_KSU=true" >> $GITHUB_ENV
            echo "KSU_VERSION=main" >> $GITHUB_ENV
          else
            echo "ENABLE_KSU=true" >> $GITHUB_ENV
            echo "KSU_VERSION=next" >> $GITHUB_ENV
          fi
          echo "ENABLE_SUSFS=true" >> $GITHUB_ENV
          echo "TARGET_ARCH=arm64" >> $GITHUB_ENV

      - name: 3. 执行 Android 16 内核编译
        run: |
          chmod +x *.sh
          ./build.sh 

      - name: 4. 上传生成的 AnyKernel3 卡刷包
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-Kernel-${{ github.event.inputs.device_model }}-Android16
          path: anykernel/*
